name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libx11-dev libxss-dev libxmu-dev \
            libgl-dev libpulse-dev libfftw3-dev \
            pkg-config valgrind clang-tidy

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: |
          cd build
          if [ -f shadercandy-test ]; then
            ./shadercandy-test
          fi

      - name: Lint with clang-tidy
        run: |
          clang-tidy src/core/*.cpp src/core/*.h \
            -p build --warnings-as-errors=warning 2>&1 || true

      - name: Check for memory leaks (valgrind)
        run: |
          cd build
          if [ -f shadercandy-test ]; then
            valgrind --leak-check=full \
              --track-origins=yes \
              --errors-for-leak-kinds=none \
              --suppressions=../.valgrind.supp \
              ./shadercandy-test
            EXIT_CODE=$?
            # Check for invalid reads/writes/uses (actual bugs), not system library leaks
            if [ $EXIT_CODE -ne 0 ]; then
              echo "Valgrind detected memory errors (not system library leaks)"
              exit 1
            fi
          fi

  build-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libx11-dev libxss-dev libxmu-dev \
            libgl-dev libpulse-dev libfftw3-dev \
            pkg-config

      - name: Configure with AddressSanitizer
        run: |
          mkdir -p build-asan && cd build-asan
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

      - name: Build
        run: cmake --build build-asan -j$(nproc)

      - name: Run tests under ASAN
        run: |
          cd build-asan
          if [ -f shadercandy-test ]; then
            ./shadercandy-test
          fi

  build-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libx11-dev libxss-dev libxmu-dev \
            libgl-dev libpulse-dev libfftw3-dev \
            pkg-config

      - name: Configure with ThreadSanitizer
        run: |
          mkdir -p build-tsan && cd build-tsan
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan -j$(nproc)

      - name: Run tests under TSAN
        run: |
          cd build-tsan
          if [ -f shadercandy-test ]; then
            ./shadercandy-test
          fi

  build-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libx11-dev libxss-dev libxmu-dev \
            libgl-dev libpulse-dev libfftw3-dev \
            pkg-config

      - name: Configure with UBSan
        run: |
          mkdir -p build-ubsan && cd build-ubsan
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"

      - name: Build
        run: cmake --build build-ubsan -j$(nproc)

      - name: Run tests under UBSAN
        run: |
          cd build-ubsan
          if [ -f shadercandy-test ]; then
            ./shadercandy-test
          fi
