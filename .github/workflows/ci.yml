name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libx11-dev libxss-dev libxmu-dev libxxf86vm-dev libxi-dev libxrandr-dev \
            libgl-dev libpulse-dev libfftw3-dev \
            pkg-config valgrind clang-tidy clang-format cppcheck \
            glslc shaderc spirv-tools

      - name: Configure
        run: make configure

      - name: Build
        run: make build

      - name: Run tests
        run: make test-all

      - name: Lint
        run: make lint

      - name: Security
        run: make security

      - name: Shader validation
        run: make validate-shaders

      - name: Accuracy gate
        run: make accuracy-gate

      - name: Performance / SIMD gate
        run: make perf-check

      - name: Valgrind
        run: make mem-valgrind

  build-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxss-dev libxmu-dev libgl-dev libpulse-dev libfftw3-dev pkg-config
      - name: Configure + build with ASan
        run: make mem-asan

  build-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxss-dev libxmu-dev libgl-dev libpulse-dev libfftw3-dev pkg-config
      - name: Configure + build with TSan
        run: make mem-tsan

  build-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxss-dev libxmu-dev libgl-dev libpulse-dev libfftw3-dev pkg-config
      - name: Configure + build with UBSan
        run: make mem-ubsan

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxss-dev libxmu-dev libgl-dev libpulse-dev libfftw3-dev pkg-config gcov
      - name: Coverage gate
        run: make coverage-gate