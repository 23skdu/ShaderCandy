name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  # Linux Build
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libgl1-mesa-dev \
          libglx-dev \
          libx11-dev \
          libxss-dev \
          libxxf86vm-dev \
          libxi-dev \
          libxrandr-dev \
          mesa-common-dev
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          export CC=clang
          export CXX=clang++
        fi
        cmake .. -GNinja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_TESTS=ON \
          -DBUILD_OPENGL=ON \
          -DBUILD_METAL=OFF
    
    - name: Build
      run: |
        cd build
        ninja -j$(nproc)
    
    - name: Run Tests
      run: |
        cd build
        if ! ./shadercandy-test; then
          echo "Tests failed!"
          exit 1
        fi
    
    - name: Package
      if: matrix.build_type == 'Release' && matrix.compiler == 'gcc'
      run: |
        cd build
        ninja package || true
        tar czf shadercandy-linux.tar.gz shadercandy-screensaver shadercandy-test shadercandy-bench ../shaders/
    
    - name: Upload artifacts
      if: matrix.build_type == 'Release' && matrix.compiler == 'gcc'
      uses: actions/upload-artifact@v4
      with:
        name: shadercandy-linux
        path: build/shadercandy-linux.tar.gz

  # macOS Build (Apple Silicon / arm64)
  build-macos:
    runs-on: macos-15
    strategy:
      matrix:
        build_type: [Release, Debug]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        brew install cmake ninja
    
    - name: Configure CMake (Xcode)
      run: |
        mkdir build
        cd build
        cmake .. -G Xcode \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DBUILD_METAL=ON \
          -DBUILD_OPENGL=OFF \
          -DBUILD_SCREENSAVER_MACOS=ON \
          -DBUILD_TESTS=ON
    
    - name: Build
      run: |
        cd build
        xcodebuild -project ShaderCandy.xcodeproj \
                   -scheme ShaderCandy \
                   -configuration ${{ matrix.build_type }} \
                   -derivedDataPath ./DerivedData
    
    - name: Validate Metal shaders
      if: matrix.build_type == 'Release'
      run: |
        make validate-metal

    - name: Package
      if: matrix.build_type == 'Release'
      run: |
        cd build
        zip -r shadercandy-macos-arm64.zip DerivedData/Build/Products/Release/ShaderCandy.saver
    
    - name: Upload artifacts
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: shadercandy-macos-arm64
        path: build/shadercandy-macos-arm64.zip

  # Shader Validation (GLSL)
  validate-shaders:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install shader compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y glslc shaderc spirv-tools
    
    - name: Validate GLSL shaders
      run: |
        GLSC=glslc ./tests/validate_shaders.sh

  # Metal Shader Validation (macOS)
  validate-metal:
    runs-on: macos-15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: brew install cmake
    
    - name: Validate Metal shaders
      run: make validate-metal

  # macOS DMG (Apple Silicon / arm64)
  build-macos-dmg:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake ninja xcodegen

    - name: Build DMG
      env:
        CMAKE_OSX_ARCHITECTURES: arm64
      run: |
        chmod +x osx/build_dmg.sh
        ./osx/build_dmg.sh

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: shadercandy-macos-arm64-dmg
        path: osx/dmg/*.dmg

  # Code Quality
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format cppcheck
    
    - name: Check formatting
      run: |
        find src tests -name "*.cpp" -o -name "*.h" | \
          xargs clang-format --dry-run --Werror || \
          (echo "Code formatting issues found. Run: find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format -i" && exit 1)
    
    - name: Static analysis
      run: |
        cppcheck --enable=all --error-exitcode=1 \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          src/core/ || true

  # Performance Benchmark
  benchmark:
    runs-on: ubuntu-latest
    needs: build-linux
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: shadercandy-linux
    
    - name: Setup virtual display
      run: |
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1920x1080x24 &
        export DISPLAY=:99
    
    - name: Run performance benchmarks
      run: |
        set -o pipefail
        export DISPLAY=:99
        tar xzf shadercandy-linux.tar.gz
        # Run the real benchmark binary (not the removed --benchmark flag)
        ./tests/run_benchmarks.sh -dir ./shaders -frames 60 2>&1 | tee benchmark_results.txt
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark_results.txt

  # Release
  release:
    needs: [build-linux, build-macos, validate-shaders, validate-metal]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release Assets
      run: |
        mv shadercandy-linux/shadercandy-linux.tar.gz ShaderCandy-Linux.tar.gz
        if [ -d shadercandy-macos-arm64 ]; then
          mv shadercandy-macos-arm64/shadercandy-macos-arm64.zip ShaderCandy-macOS-arm64.zip
        fi
        if [ -d shadercandy-macos-arm64-dmg ]; then
          mv shadercandy-macos-arm64-dmg/*.dmg ShaderCandy-macOS-arm64.dmg
        fi
    
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ShaderCandy-Linux.tar.gz
          ShaderCandy-macOS-arm64.zip
          ShaderCandy-macOS-arm64.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Documentation
  documentation:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check documentation
      run: |
        # Verify all documentation files exist
        test -f README.md
        test -f docs/ShaderCandyMasterPlan.md
        test -f docs/HdrImplementation.md
        
        # Check for broken links (basic)
        grep -r "\[.*\](.*)" docs/ README.md --include="*.md" | \
          grep -v "http" | \
          while read line; do
            link=$(echo "$line" | grep -oP '(?<=\]\()[^)]+')
            if [ ! -f "$link" ] && [ ! -d "$link" ]; then
              echo "Warning: Potential broken link: $link"
            fi
          done || true
    
    - name: Generate shader catalog
      run: |
        echo "# Shader Catalog" > SHADER_CATALOG.md
        echo "" >> SHADER_CATALOG.md
        echo "## Available Shaders" >> SHADER_CATALOG.md
        echo "" >> SHADER_CATALOG.md
        
        for shader in shaders/effects/*.frag; do
          name=$(basename "$shader" .frag)
          echo "### $name" >> SHADER_CATALOG.md
          echo "" >> SHADER_CATALOG.md
          # Extract first comment block as description
          head -20 "$shader" | grep "//" | sed 's/^\/\//-/' >> SHADER_CATALOG.md
          echo "" >> SHADER_CATALOG.md
        done
    
    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: |
          README.md
          docs/
          SHADER_CATALOG.md
