name: ShaderCandyInstaller
options:
  bundleIdPrefix: com.shadercandy
  deploymentTarget:
    macOS: "11.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO

targets:
  ShaderCandyInstaller:
    type: application
    platform: macOS
    deploymentTarget: "11.0"
    sources:
      - path: .
        excludes:
          - "*.xcodeproj"
          - "*.plist"
          - "*.sh"
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.shadercandy.installer
        PRODUCT_NAME: ShaderCandy Installer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS:
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Info.plist
      properties:
        CFBundleName: ShaderCandy Installer
        CFBundleDisplayName: ShaderCandy Installer
        CFBundleIdentifier: com.shadercandy.installer
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: ShaderCandy Installer
        NSHumanReadableCopyright: Copyright © 2024 ShaderCandy. All rights reserved.
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
